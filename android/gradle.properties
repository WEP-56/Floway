org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Kotlin's incremental cache cannot always be closed on Windows (the compiler daemon
# loses the handle, e.g. to a virus scanner), which fails :android_file_picker with
# "Could not close incremental caches". Non-incremental Kotlin compiles are slower but
# deterministic, and only the small plugin modules are affected.
kotlin.incremental=false
