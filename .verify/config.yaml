mixed-port: 17890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:19090
secret: verifytoken
dns:
  enable: false
proxies:
  - {name: "node-a", type: http, server: 127.0.0.1, port: 17892}
  - {name: "node-b", type: http, server: 127.0.0.1, port: 17893}
proxy-groups:
  - {name: PROXY, type: select, proxies: [node-a, node-b, DIRECT]}
  - {name: LB, type: load-balance, proxies: [node-a, node-b], strategy: round-robin}
  - {name: RELAY, type: relay, proxies: [node-a, node-b]}
sub-rules:
  ads: ["DOMAIN-SUFFIX,ads.test,REJECT"]
rules:
  - "DST-PORT,18080,DIRECT"
  - "IP-CIDR,10.9.9.9/32,DIRECT"
  - "SUB-RULE,(NETWORK,tcp),ads"
  - "MATCH,DIRECT"
